[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-vton-test"
version = "0.1.0"
description = "Test harness for Fast_VTON_full.pt (virtual try-on inference + Gradio demo)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Fast-VTON provides the model classes (UNet, VAE, inversion, garment encoder) that
    # this harness reconstructs the bundle from. Install it from the sibling checkout:
    #     pip install -e ../Fast-VTON
    # It is intentionally unpinned here because it carries its own locked versions of
    # torch / diffusers / transformers.
    "swiftedit",
    "accelerate",
    "diffusers==0.22.0",
    "einops",
    "ftfy",
    "gradio>=4.40,<5",
    "huggingface-hub==0.25.2",
    "Jinja2",
    "numpy>=1.26,<2",
    "opencv-python-headless",
    "pillow",
    "pyyaml",
    "safetensors",
    "tensorboard",
    "torch==2.2.1",
    "torchaudio==2.2.1",
    "torchvision==0.17.1",
    "transformers==4.37.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.scripts]
fast-vton-app = "fast_vton.app:main"
fast-vton-test = "fast_vton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fast_vton*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter / formatter-aware tools
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: requires GPU and Fast_VTON_full.pt",
]
